name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        working-directory: apps/web
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - name: Seed and start API
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./playwright.db
          SECRET_KEY: playwright-secret
          LLM_PROVIDER: mock
          SEED_DEMO: "true"
          CORS_ORIGINS: http://127.0.0.1:3000
        run: |
          python -c "from app.seed import seed; seed()"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: Start web and run Playwright
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000 && break; sleep 1; done
          pnpm test:e2e
