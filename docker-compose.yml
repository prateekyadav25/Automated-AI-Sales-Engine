services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrayian
      POSTGRES_PASSWORD: agrayian
      POSTGRES_DB: agrayian
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrayian"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agrayian
      MINIO_ROOT_PASSWORD: agrayiansecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agrayian_app:agrayian@postgres:5432/agrayian
      DATABASE_ADMIN_URL: postgresql+psycopg://agrayian:agrayian@postgres:5432/agrayian
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PROVIDER: minio
      S3_ACCESS_KEY: agrayian
      S3_SECRET_KEY: agrayiansecret
      S3_BUCKET: agrayian
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$SEED_DEMO\" = \"true\" ]; then python -m app.seed; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agrayian_app:agrayian@postgres:5432/agrayian
      DATABASE_ADMIN_URL: postgresql+psycopg://agrayian:agrayian@postgres:5432/agrayian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,automation,providers,ai,maintenance

  beat:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agrayian_app:agrayian@postgres:5432/agrayian
      DATABASE_ADMIN_URL: postgresql+psycopg://agrayian:agrayian@postgres:5432/agrayian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
