apiVersion: batch/v1
kind: Job
metadata:
  name: agrayian-migrate
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: agrayian/api:prod
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: agrayian-config
            - secretRef:
                name: agrayian-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agrayian-secrets
                  key: DATABASE_ADMIN_URL
