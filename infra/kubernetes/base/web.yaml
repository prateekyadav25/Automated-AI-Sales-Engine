apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrayian-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agrayian-web
  template:
    metadata:
      labels:
        app: agrayian-web
    spec:
      containers:
        - name: web
          image: agrayian/web:prod
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: agrayian-web
spec:
  selector:
    app: agrayian-web
  ports:
    - port: 3000
      targetPort: 3000
