apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: staging-
patches:
  - target:
      kind: ConfigMap
      name: agrayian-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
      - op: replace
        path: /data/EMAIL_PROVIDER
        value: mock
      - op: replace
        path: /data/DISCOVERY_PROVIDER
        value: mock
      - op: replace
        path: /data/VOICE_PROVIDER
        value: mock
      - op: replace
        path: /data/LINKEDIN_ADS_MODE
        value: mock
      - op: replace
        path: /data/META_ADS_MODE
        value: mock
      - op: replace
        path: /data/SEED_DEMO
        value: "false"
      - op: replace
        path: /data/META_GRAPH_API_VERSION
        value: v26.0
      - op: replace
        path: /data/SOCIAL_GROWTH_PUBLISH_MODE
        value: disabled
      - op: replace
        path: /data/SOCIAL_GROWTH_INSIGHTS_MODE
        value: disabled
      - op: replace
        path: /data/GA4_MODE
        value: disabled
