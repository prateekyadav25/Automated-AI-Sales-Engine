groups:
  - name: agrayian-production
    rules:
      - alert: ApiElevatedErrors
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: page }
      - alert: DatabaseUnavailable
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: page }
      - alert: QueueBacklog
        expr: celery_queue_length > 200
        for: 10m
        labels: { severity: ticket }
      - alert: WorkerMissing
        expr: celery_workers == 0
        for: 5m
        labels: { severity: page }
      - alert: BeatMissing
        expr: celery_beat_up == 0
        for: 5m
        labels: { severity: page }
      - alert: DeadLetterGrowth
        expr: increase(provider_dead_letters_total[30m]) > 10
        for: 10m
        labels: { severity: ticket }
      - alert: BackupFailure
        expr: backup_success == 0
        for: 1h
        labels: { severity: page }
      - alert: CustomerConnectorFailure
        expr: increase(integration_sync_failures_total[15m]) > 3
        for: 10m
        labels: { severity: ticket }
      - alert: StaleCustomerUsage
        expr: increase(customer_data_stale_total{component="usage"}[1h]) > 0
        for: 30m
        labels: { severity: ticket }
      - alert: StaleCustomerFinance
        expr: increase(customer_data_stale_total{component="finance"}[1h]) > 0
        for: 30m
        labels: { severity: ticket }
      - alert: StaleCustomerSupport
        expr: increase(customer_data_stale_total{component="support"}[1h]) > 0
        for: 30m
        labels: { severity: ticket }
      - alert: InboxBacklog
        expr: increase(provider_dead_letters_total[15m]) > 5
        for: 10m
        labels: { severity: ticket }
